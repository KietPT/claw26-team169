[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-daily-digest"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "python-telegram-bot>=21,<23",
    "apscheduler>=3.10,<4",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "pyyaml>=6.0.3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov"]

[tool.setuptools]
packages = ["connectors", "digest", "delivery", "tgbot"]
py-modules = ["config", "main", "scheduler", "webui"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
